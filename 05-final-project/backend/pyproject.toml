[project]
name = "card-catalog-backend"
version = "0.1.0"
description = "FastAPI backend for Card Catalog (a mini Kanban board)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "bcrypt>=4.1",
    "fastapi>=0.115",
    "itsdangerous>=2.2",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pyyaml>=6",
    "pytest-postgresql>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: exercises a real Postgres database (see tests/integration/)",
]
