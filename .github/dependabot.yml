# Keeps the SHA-pinned actions and the app's lockfiles current. Each update
# arrives as a PR that must pass the same four required checks; merging stays
# a human decision (see 05-final-project/security-audit/).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /05-final-project/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: uv
    directory: /05-final-project/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
