# CI for the Card Catalog app (05-final-project, the course final project).
#
# Every push and pull request runs five independent jobs. The first four are
# required status checks on `main`, so a PR can't merge unless each passes:
#
#   lint               oxlint + Vitest + production build of the frontend
#   unit-tests         backend pytest, unit/store layer (no services)
#   integration-tests  backend pytest against a real, ephemeral Postgres 17
#   container          docker build + a Compose smoke test of the built image
#   security-scan      Semgrep + pip-audit (see 05-final-project/security-audit/)
#
# deploy.yml reuses this workflow (workflow_call) as its gate before deploying.

name: CI

on:
  push:
    branches: [main]
    paths:
      - "05-final-project/**"
      - ".github/workflows/**"
  # No path filter on PRs: these four checks are required to merge into
  # main, and a required check that never runs would block the PR forever.
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  # github.workflow is the *caller's* name when deploy.yml runs this via
  # workflow_call, so the deploy's CI gate never cancels (or is cancelled by)
  # the regular CI run for the same push.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_DIR: 05-final-project

jobs:
  lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build # catches import/syntax errors oxlint doesn't

  unit-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: ${{ env.APP_DIR }}/backend/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest -m "not integration"

  integration-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same major version as production (RDS Postgres 17). The runner image
      # ships an older bundled Postgres, so install 17 from the PGDG apt repo;
      # pytest-postgresql then boots a throwaway cluster from its binaries
      # (see docs/testing.md) — no service container, no Docker.
      - name: Install PostgreSQL 17
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-17
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: ${{ env.APP_DIR }}/backend/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest -m integration
        env:
          PG_CTL_PATH: /usr/lib/postgresql/17/bin/pg_ctl

  container:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.APP_DIR }}
          tags: card-catalog:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Bring the real Compose stack up on the image just built (Postgres +
      # Alembic migrate + app) and prove it serves: health, the frontend,
      # a login, and an authenticated API call. Throwaway credentials only.
      - name: Compose smoke test
        run: | # nosemgrep: yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell -- curl output goes to grep or a fixed python3 -c, never to a shell (see 05-final-project/security-audit/)
          set -euo pipefail
          HASH=$(docker run --rm card-catalog:local python -c \
            "import bcrypt; print(bcrypt.hashpw(b'ci-smoke-password', bcrypt.gensalt(4)).decode())")
          {
            echo "AUTH_PASSWORD_HASH='$HASH'"
            echo "AUTH_SECRET_KEY=$(openssl rand -hex 32)"
          } > .env
          docker compose up -d --no-build --wait --wait-timeout 120
          B=http://127.0.0.1:8000
          curl -fsS $B/health
          curl -fsS $B/ | grep -q '<title>Card Catalog</title>'
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/api/cards)" = 401
          curl -fsS -c cj -H 'content-type: application/json' \
            -d '{"password":"ci-smoke-password"}' $B/api/login
          curl -fsS -b cj $B/api/cards | python3 -c "import json,sys; assert len(json.load(sys.stdin)) >= 1"
          echo "smoke test passed"
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs

  # Deterministic layer of the security audit (05-final-project/security-audit/):
  # Semgrep over the app and these workflows, plus known-vulnerability checks
  # on the backend's runtime dependencies. Any new finding fails the job; fix
  # it, or annotate it with `nosemgrep: <rule> -- <reason>` and record why.
  security-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Semgrep
        run: ${{ env.APP_DIR }}/security-audit/run-semgrep.sh --error
      - name: pip-audit (backend runtime dependencies)
        working-directory: ${{ env.APP_DIR }}/backend
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -q > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
